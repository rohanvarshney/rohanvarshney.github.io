      .social-icons a[data-tooltip]::after {
        content: attr(data-tooltip);
        position: absolute;
        bottom: calc(100% + 10px);
        left: 50%;
        transform: translate(-50%, 4px);
        background-color: #111;
        color: #fff;
        border: 1px solid #dc143c;
        border-radius: 6px;
        padding: 4px 10px;

        visibility: hidden;
        pointer-events: none;
        transition: opacity 0.15s ease, transform 0.15s ease, visibility 0.15s ease;
        z-index: 20;
      }

      .social-icons a[data-tooltip]::before {
        content: '';
        position: absolute;
        bottom: calc(100% + 5px);
        left: 50%;
        width: 0;
        height: 0;
        transform: translate(-50%, 4px);
        border: 5px solid transparent;

        border-bottom: 0;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 0.15s ease, transform 0.15s ease, visibility 0.15s ease;
        z-index: 20;

      .social-icons a[data-tooltip]:hover::before,
      .social-icons a[data-tooltip]:focus-visible::after,

  <script>
    var bannerTimeout;

    function showComingSoon(event, label) {
      event.preventDefault();
      var banner = document.getElementById('coming-soon-banner');
      var text = document.getElementById('coming-soon-text');
      text.textContent = label + ': coming soon!';
      banner.classList.add('visible');

      if (bannerTimeout) {
        clearTimeout(bannerTimeout);
      }
      bannerTimeout = setTimeout(function () {
        banner.classList.remove('visible');
      }, 4000);
    }

    function hideComingSoon() {
      var banner = document.getElementById('coming-soon-banner');
      banner.classList.remove('visible');
    }
  </script>
