<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="apple-touch-icon" sizes="208x208" href="./assets/img/logo.ico">
  <link rel="icon" type="image/ico" href="./assets/img/logo.ico">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <title>Rohan Varshney</title>
  <meta content='width=device-width, initial-scale=1.0, shrink-to-fit=no' name='viewport' />
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/latest/css/font-awesome.min.css">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-8RL9F3RF9E"></script>
  <script src="./assets/js/analytics.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Courier New', 'Monaco', monospace;
      background-color: #f5f5f5;
      color: #000;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      width: 100%;
      display: flex;
      background-color: #f5f5f5;
      min-height: 80vh;
    }

    .left-column {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      position: relative;
    }

    .image-wrapper {
      position: relative;
      width: 100%;
      max-width: 400px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .image-background {
      position: absolute;
      width: 100%;
      height: 100%;
      background: #e0e0e0;
      border-radius: 16px;
      opacity: 0.3;
      z-index: 0;
    }

    .profile-image {
      width: 100%;
      height: auto;
      border-radius: 16px;
      position: relative;
      z-index: 1;
      object-fit: cover;
    }

    .divider {
      width: 1px;
      background-color: #333;
      margin: 0 40px;
      flex-shrink: 0;
    }

    .right-column {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 40px;
    }

    .question {
      font-size: 2.5rem;
      font-weight: bold;
      color: #dc143c;
      margin-bottom: 40px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      letter-spacing: -0.02em;
    }

    .cursor {
      display: inline-block;
      width: 3px;
      height: 1.2em;
      background-color: #dc143c;
      animation: blink 1s infinite;
      margin-left: 4px;
      vertical-align: baseline;
    }

    @keyframes blink {

      0%,
      50% {
        opacity: 1;
      }

      51%,
      100% {
        opacity: 0;
      }
    }

    .intro {
      font-size: 1.2rem;
      line-height: 1.8;
      margin-bottom: 40px;
      color: #000;
    }

    .intro-text {
      margin-bottom: 20px;
      font-weight: normal;
      letter-spacing: 0.05em;
    }

    .social-section {
      margin-bottom: 30px;
    }

    .social-section:last-child {
      margin-bottom: 0;
    }

    .social-section-title {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: normal;
    }

    .social-section-tagline {
      font-size: 0.9rem;
      color: #000;
      margin-bottom: 12px;
    }

    .social-icons {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }

    .social-icons:empty {
      display: none;
    }

    .social-icons a {
      color: #dc143c;
      font-size: 1.5rem;
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .social-icons a:hover {
      opacity: 0.7;
    }

    .social-icons a svg {
      width: 1em;
      height: 1em;
      fill: currentColor;
      vertical-align: -0.125em;
    }

    .banner {
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      margin-top: 16px;
      border: 1px solid #dc143c;
      border-radius: 8px;
      background-color: #fff5f7;
      color: #dc143c;
      font-size: 0.85rem;
      letter-spacing: 0.03em;
    }

    .banner.visible {
      display: flex;
    }

    .banner-close {
      background: none;
      border: none;
      color: #dc143c;
      font-family: inherit;
      font-size: 1rem;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }

      .divider {
        width: 100%;
        height: 1px;
        margin: 20px 0;
      }

      .question {
        font-size: 1.8rem;
      }

      .intro {
        font-size: 1rem;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="left-column">
      <div class="image-wrapper">
        <div class="image-background"></div>
        <img src="./assets/img/faces/rohan.jpg" alt="Rohan Varshney" class="profile-image">
      </div>
    </div>

    <div class="divider"></div>

    <div class="right-column">
      <h1 class="question">Rohan Varshney<span class="cursor"></span></h1>

      <div class="intro">
        <div class="intro-text">
          SENIOR SOFTWARE ENGINEER @ LYFT
        </div>
      </div>

      <div class="social-section">
        <div class="social-section-title">Professional</div>
        <div class="social-section-tagline">Making data move faster to the right places.</div>
        <div class="social-icons">
          <a href="resume.pdf" target="_blank" rel="noopener noreferrer" title="Resumé"
            data-analytics-event="resume_download" data-analytics-category="professional" data-analytics-label="Resume PDF">
            <i class="fa fa-file"></i>
          </a>
          <a href="https://linkedin.com/in/rohanvarshney" target="_blank" rel="noopener noreferrer" title="LinkedIn"
            data-analytics-event="social_link_click" data-analytics-category="professional" data-analytics-label="LinkedIn">
            <i class="fa fa-linkedin"></i>
          </a>
          <a href="https://github.com/rohanvarshney" target="_blank" rel="noopener noreferrer" title="GitHub"
            data-analytics-event="social_link_click" data-analytics-category="professional" data-analytics-label="GitHub">
            <i class="fa fa-github"></i>
          </a>
        </div>
      </div>

      <div class="social-section">
        <div class="social-section-title">Personal</div>
        <div class="social-section-tagline">Always moving, always eating, always listening.</div>
        <div class="social-icons">
          <a href="https://www.instagram.com/rohanvar" target="_blank" rel="noopener noreferrer" title="Instagram"
            data-analytics-event="social_link_click" data-analytics-category="personal" data-analytics-label="Instagram">
            <i class="fa fa-instagram"></i>
          </a>
          <a href="https://open.spotify.com/user/rohanvar?si=cfe3baaac7294839" target="_blank" rel="noopener noreferrer"
            title="Spotify" data-analytics-event="social_link_click" data-analytics-category="personal" data-analytics-label="Spotify">
            <i class="fa fa-spotify"></i>
          </a>
          <a href="https://beliapp.co/app/rohanvar" target="_blank" rel="noopener noreferrer" title="Beli"
            data-analytics-event="social_link_click" data-analytics-category="personal" data-analytics-label="Beli">
            <i class="fa fa-cutlery"></i>
          </a>
        </div>
      </div>

      <div class="social-section">
        <div class="social-section-title">Portfolio</div>
        <div class="social-section-tagline">Making crowds move to the right frequencies.</div>
        <div class="social-icons">
          <a href="#" onclick="showComingSoon(event, 'Raas / Garba')" title="Raas / Garba"
            data-analytics-event="portfolio_link_click" data-analytics-category="portfolio"
            data-analytics-label="Raas / Garba" data-analytics-status="coming_soon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4.2 20.4a1.1 1.1 0 0 1-.2-1.5L15.6 2.7a1.4 1.4 0 0 1 2.2 1.7L5.7 20.3a1.1 1.1 0 0 1-1.5.1zm15.6 0a1.1 1.1 0 0 1-1.5-.1L6.2 4.4a1.4 1.4 0 0 1 2.2-1.7l11.6 16.2a1.1 1.1 0 0 1-.2 1.5z" />
            </svg>
          </a>
          <a href="#" onclick="showComingSoon(event, 'SpotKit')" title="SpotKit"
            data-analytics-event="portfolio_link_click" data-analytics-category="portfolio"
            data-analytics-label="SpotKit" data-analytics-status="coming_soon">
            <i class="fa fa-music"></i>
          </a>
          <a href="#" onclick="showComingSoon(event, 'DJing')" title="DJing"
            data-analytics-event="portfolio_link_click" data-analytics-category="portfolio"
            data-analytics-label="DJing" data-analytics-status="coming_soon">
            <i class="fa fa-headphones"></i>
          </a>
          <a href="#" onclick="showComingSoon(event, 'Production')" title="Production"
            data-analytics-event="portfolio_link_click" data-analytics-category="portfolio"
            data-analytics-label="Production" data-analytics-status="coming_soon">
            <i class="fa fa-microphone"></i>
          </a>
        </div>
        <div id="coming-soon-banner" class="banner" role="status" aria-live="polite">
          <span id="coming-soon-text">Coming soon!</span>
          <button type="button" class="banner-close" aria-label="Close banner" onclick="hideComingSoon()">&times;</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    var bannerTimeout;

    function showComingSoon(event, label) {
      event.preventDefault();
      var banner = document.getElementById('coming-soon-banner');
      var text = document.getElementById('coming-soon-text');
      text.textContent = label + ' — coming soon!';
      banner.classList.add('visible');

      if (bannerTimeout) {
        clearTimeout(bannerTimeout);
      }
      bannerTimeout = setTimeout(function () {
        banner.classList.remove('visible');
      }, 4000);
    }

    function hideComingSoon() {
      var banner = document.getElementById('coming-soon-banner');
      banner.classList.remove('visible');
    }
  </script>
</body>

</html>
